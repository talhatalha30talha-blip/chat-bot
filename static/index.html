<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quality Resource LLC – AI Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- DOMPurify for secure HTML sanitization -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
  
  <!-- Custom styling for markdown text, lists, and tables -->
  <style>
    .markdown-body table { width: 100%; border-collapse: collapse; margin: 8px 0; }
    .markdown-body th, .markdown-body td { border: 1px solid #cbd5e1; padding: 6px 10px; font-size: 0.875rem; text-align: left; }
    .markdown-body th { background-color: #f1f5f9; font-weight: 600; }
    .markdown-body ul { list-style-type: disc; padding-left: 20px; margin: 6px 0; }
    .markdown-body ol { list-style-type: decimal; padding-left: 20px; margin: 6px 0; }
    .markdown-body p { margin-bottom: 8px; }
    .markdown-body strong { font-weight: 700; color: #0f172a; }
  </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-2xl bg-white rounded-2xl shadow-lg flex flex-col h-[85vh] overflow-hidden border border-slate-200">
    
    <!-- Header -->
    <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-semibold">Quality Resource LLC Assistant</h1>
        <p class="text-xs text-slate-400">Powered by RAG &amp; LangGraph</p>
      </div>
      <button id="new-chat-btn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 transition">
        New Session
      </button>
    </div>

    <!-- Chat Messages Container -->
    <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-4">
      <div class="flex items-start gap-3">
        <div class="bg-slate-200 text-slate-800 rounded-2xl rounded-tl-none px-4 py-3 text-sm max-w-[80%] markdown-body">
          Hello! Ask me anything about Quality Resource LLC's website or services.
        </div>
      </div>
    </div>

    <!-- Input Form -->
    <form id="chat-form" class="border-t border-slate-200 p-4 bg-slate-50 flex gap-3">
      <input
        id="user-input"
        type="text"
        placeholder="Type your question..."
        autocomplete="off"
        required
        class="flex-1 rounded-xl border border-slate-300 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900"
      />
      <button
        id="send-btn"
        type="submit"
        class="bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium px-5 py-2.5 rounded-xl transition disabled:opacity-50"
      >
        Send
      </button>
    </form>

  </div>

  <script>
    const chatBox = document.getElementById("chat-box");
    const chatForm = document.getElementById("chat-form");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const newChatBtn = document.getElementById("new-chat-btn");

    let threadId = "web-" + Math.random().toString(36).substring(2, 10);

    newChatBtn.addEventListener("click", () => {
      threadId = "web-" + Math.random().toString(36).substring(2, 10);
      chatBox.innerHTML = `
        <div class="flex items-start gap-3">
          <div class="bg-slate-200 text-slate-800 rounded-2xl rounded-tl-none px-4 py-3 text-sm max-w-[80%] markdown-body">
            Started a new session. How can I help you?
          </div>
        </div>
      `;
    });

    // Robust built-in Markdown Parser (handles bold **text**, bullet points -, and paragraphs)
    // Enhanced Markdown Parser (Handles tables, bold **text**, bullet points, and line breaks)
    function parseMarkdown(text) {
      if (!text) return "";
      
      // Escape HTML entities for safety
      let html = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      let lines = html.split('\n');
      let processedLines = [];
      let inList = false;
      let inTable = false;
      let tableRows = [];

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();

        // Check if line is part of a Markdown table (starts and ends with |)
        if (line.startsWith('|') && line.endsWith('|')) {
          // Skip the separator line like |---|---|---|
          if (line.includes('---')) {
            continue;
          }
          if (!inTable) {
            if (inList) { processedLines.push('</ul>'); inList = false; }
            inTable = true;
            tableRows = [];
          }
          tableRows.push(line);
          continue;
        } else if (inTable) {
          // Table ended, compile rows into an HTML table
          let tableHtml = '<table>';
          tableRows.forEach((rowStr, rowIndex) => {
            let cells = rowStr.split('|').filter(c => c.trim() !== '');
            tableHtml += '<tr>';
            cells.forEach(cell => {
              let cellContent = cell.trim().replace(/&lt;br&gt;/g, '<br>');
              // Parse bold inside table cells
              cellContent = cellContent.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
              let tag = rowIndex === 0 ? 'th' : 'td';
              tableHtml += `<${tag}>${cellContent}</${tag}>`;
            });
            tableHtml += '</tr>';
          });
          tableHtml += '</table>';
          processedLines.push(tableHtml);
          inTable = false;
          tableRows = [];
        }

        // Convert bullet points (- item or * item) into list items
        if (line.startsWith('- ') || line.startsWith('* ')) {
          if (inTable) { processedLines.push('</table>'); inTable = false; }
          if (!inList) {
            processedLines.push('<ul>');
            inList = true;
          }
          let itemText = line.substring(2).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          processedLines.push(`<li>${itemText}</li>`);
          continue;
        } else {
          if (inList) {
            processedLines.push('</ul>');
            inList = false;
          }
        }

        // Convert **bold** to <strong>bold</strong> on normal lines
        let formattedLine = line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        processedLines.push(formattedLine);
      }

      // Close open table or list if text ends with them
      if (inTable) {
        let tableHtml = '<table>';
        tableRows.forEach((rowStr, rowIndex) => {
          let cells = rowStr.split('|').filter(c => c.trim() !== '');
          tableHtml += '<tr>';
          cells.forEach(cell => {
            let cellContent = cell.trim().replace(/&lt;br&gt;/g, '<br>');
            cellContent = cellContent.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            let tag = rowIndex === 0 ? 'th' : 'td';
            tableHtml += `<${tag}>${cellContent}</${tag}>`;
          });
          tableHtml += '</tr>';
        });
        tableHtml += '</table>';
        processedLines.push(tableHtml);
      }
      if (inList) {
        processedLines.push('</ul>');
      }

      return processedLines.join('<br>');
    }

    function appendMessage(role, text = "") {
      const wrapper = document.createElement("div");
      wrapper.className = role === "user" ? "flex justify-end" : "flex items-start gap-3";

      const bubble = document.createElement("div");
      
      if (role === "user") {
        bubble.className = "bg-slate-900 text-white rounded-2xl rounded-tr-none px-4 py-3 text-sm max-w-[80%] whitespace-pre-wrap";
        bubble.textContent = text;
      } else {
        bubble.className = "bg-slate-200 text-slate-800 rounded-2xl rounded-tl-none px-4 py-3 text-sm max-w-[80%] markdown-body overflow-x-auto";
        const parsedHtml = parseMarkdown(text);
        bubble.innerHTML = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(parsedHtml) : parsedHtml;
      }

      wrapper.appendChild(bubble);
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
      return bubble;
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      appendMessage("user", message);
      userInput.value = "";
      userInput.disabled = true;
      sendBtn.disabled = true;

      const botBubble = appendMessage("bot", "...");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, thread_id: threadId })
        });

        if (!response.ok) throw new Error("Server error: " + response.status);

        const data = await response.json();
        
        if (data.reply) {
          const parsedHtml = parseMarkdown(data.reply);
          botBubble.innerHTML = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(parsedHtml) : parsedHtml;
        } else {
          botBubble.textContent = "Received empty response from assistant.";
        }

      } catch (error) {
        console.error(error);
        botBubble.textContent = "Error: Could not reach the chatbot server.";
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    });
  </script>
</body>
</html>
